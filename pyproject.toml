[project]
name = "rag-negu-expert"
version = "0.1.0"
description = "LLM Wiki expert system about Jose Agustin BARRACHINA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.1.0",
    "langchain==0.3.27",
    "langchain-openai==0.3.30",
    "langchain-community==0.3.27",
    "gradio==5.42.0",
    "tqdm==4.67.1",
    "jq==1.10.0",
    "pi-heif==1.1.1",
    "pdf2image==1.17.0",
    "pdfminer==20191125",
    "pdfminer.six==20221105",
    "pymupdf==1.26.5",
    "playwright==1.55.0",
    "unstructured-inference==1.0.5",
    "unstructured[all-docs]==0.18.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]
